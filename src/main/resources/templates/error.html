<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${status} + ' · Global Tech Radar'">Error · Global Tech Radar</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<main style="min-height:100vh;display:grid;place-items:center;padding:24px">
    <div class="card" style="max-width:480px;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center">
        <div class="eyebrow" style="margin:0">Global Tech Radar</div>
        <div class="kpi-value" style="font-size:56px" th:text="${status}">404</div>
        <h1 style="font-size:20px" th:text="${status == 404} ? 'Signal not found' : 'Something went wrong'">Signal not found</h1>
        <p class="text-2" th:text="${status == 404} ? 'The page or record you requested does not exist in the current dataset.' : 'An unexpected error occurred. Please try again.'"></p>
        <p class="muted mono" style="font-size:12px" th:text="${path}"></p>
        <a class="btn primary" href="/">Back to dashboard</a>
    </div>
</main>
</body>
</html>

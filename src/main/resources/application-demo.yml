# Optional profile: runs fully in-memory (H2) when MySQL is not available.
# Usage: ./gradlew bootRun --args='--spring.profiles.active=demo'
spring:
  datasource:
    url: jdbc:h2:mem:gtr;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop

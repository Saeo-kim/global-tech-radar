spring:
  application:
    name: global-tech-radar
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:global_tech_radar}?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  thymeleaf:
    cache: ${THYMELEAF_CACHE:false}

server:
  port: ${SERVER_PORT:8090}
  error:
    whitelabel:
      enabled: false

radar:
  data:
    # Which IntelligenceDataProvider seeds the database. Only "sample" ships with the MVP.
    provider: ${RADAR_DATA_PROVIDER:sample}
    # Seed the database on startup when it is empty.
    seed-on-startup: true
  integrations:
    # Placeholders for future live API integrations. Nothing is fetched while enabled=false.
    - id: worldbank
      name: World Bank Open Data (country indicators)
      domain: Country Intelligence
      base-url: https://api.worldbank.org/v2
      enabled: false
    - id: jobs
      name: Job board / remote-jobs API
      domain: Global Work Market
      base-url: ""
      api-key: ${JOBS_API_KEY:}
      enabled: false
    - id: news
      name: Technology news / RSS aggregation
      domain: Intelligence Reports
      base-url: ""
      api-key: ${NEWS_API_KEY:}
      enabled: false
    - id: github
      name: GitHub / package-registry trend signals
      domain: Technology Radar
      base-url: https://api.github.com
      api-key: ${GITHUB_TOKEN:}
      enabled: false

  news:
    # Collect real news from the RSS/Atom feeds below. Set RADAR_NEWS_COLLECTION=false to run offline.
    collection-enabled: ${RADAR_NEWS_COLLECTION:true}
    collect-interval: ${RADAR_NEWS_INTERVAL:PT1H}
    initial-delay: PT20S
    request-timeout: PT20S
    max-items-per-feed: 25
    max-feed-bytes: 5242880
    retention-days: 180
    user-agent: "GlobalTechRadar/0.1 (RSS collector)"
    # Refuse feeds on loopback/private networks (users can register URLs).
    allow-private-hosts: false
    # Certificate store for feed TLS validation: auto (Windows store on Windows, JDK elsewhere) | os | jdk.
    # Needed when antivirus HTTPS scanning or a corporate proxy re-signs certificates. Validation is never disabled.
    trust-store: ${RADAR_NEWS_TRUST_STORE:auto}
    # Each feed: id, name, url, type (OFFICIAL_BLOG|RESEARCH|GOVERNMENT|MEDIA), default category, default region,
    # optional publisher company. Category/region are refined per article from its text.
    feeds:
      # --- Official company blogs
      - { id: google-ai, name: Google AI Blog, url: "https://blog.google/technology/ai/rss/", type: OFFICIAL_BLOG, category: AI, region: US, company: Google }
      - { id: deepmind, name: Google DeepMind Blog, url: "https://deepmind.google/blog/rss.xml", type: OFFICIAL_BLOG, category: AI, region: GB, company: Google }
      - { id: openai, name: OpenAI News, url: "https://openai.com/news/rss.xml", type: OFFICIAL_BLOG, category: AI, region: US, company: OpenAI }
      - { id: nvidia, name: NVIDIA Blog, url: "https://blogs.nvidia.com/feed/", type: OFFICIAL_BLOG, category: SEMICONDUCTOR, region: US, company: NVIDIA }
      - { id: microsoft-research, name: Microsoft Research Blog, url: "https://www.microsoft.com/en-us/research/feed/", type: OFFICIAL_BLOG, category: AI, region: US, company: Microsoft }
      - { id: aws-news, name: AWS News Blog, url: "https://aws.amazon.com/blogs/aws/feed/", type: OFFICIAL_BLOG, category: CLOUD_DEVOPS, region: US, company: Amazon }
      - { id: github-blog, name: GitHub Blog, url: "https://github.blog/feed/", type: OFFICIAL_BLOG, category: SOFTWARE_ENGINEERING, region: US, company: GitHub }
      - { id: google-security, name: Google Online Security Blog, url: "https://feeds.feedburner.com/GoogleOnlineSecurityBlog", type: OFFICIAL_BLOG, category: CYBERSECURITY, region: US, company: Google }
      - { id: cloudflare, name: Cloudflare Blog, url: "https://blog.cloudflare.com/rss/", type: OFFICIAL_BLOG, category: CLOUD_DEVOPS, region: US, company: Cloudflare }
      - { id: databricks, name: Databricks Blog, url: "https://www.databricks.com/feed", type: OFFICIAL_BLOG, category: DATA_ENGINEERING, region: US, company: Databricks }
      - { id: kubernetes, name: Kubernetes Blog, url: "https://kubernetes.io/feed.xml", type: OFFICIAL_BLOG, category: CLOUD_DEVOPS, region: Global }
      - { id: huggingface, name: Hugging Face Blog, url: "https://huggingface.co/blog/feed.xml", type: OFFICIAL_BLOG, category: AI, region: Global, company: Hugging Face }
      # --- Research institutions and publications
      - { id: mit-ai, name: MIT News - Artificial Intelligence, url: "https://news.mit.edu/topic/mitartificial-intelligence2-rss.xml", type: RESEARCH, category: AI, region: US }
      - { id: mit-robotics, name: MIT News - Robotics, url: "https://news.mit.edu/topic/mitrobotics-rss.xml", type: RESEARCH, category: ROBOTICS, region: US }
      - { id: arxiv-cs-ai, name: arXiv cs.AI (new submissions), url: "https://rss.arxiv.org/rss/cs.AI", type: RESEARCH, category: AI, region: Global, enabled: false }
      # --- Government and agencies
      - { id: nasa, name: NASA News Releases, url: "https://www.nasa.gov/news-release/feed/", type: GOVERNMENT, category: SPACE, region: US, company: NASA }
      - { id: esa, name: ESA Top News, url: "https://www.esa.int/rssfeed/TopNews", type: GOVERNMENT, category: SPACE, region: Europe, company: ESA }
      - { id: cisa, name: CISA Cybersecurity Advisories, url: "https://www.cisa.gov/cybersecurity-advisories/all.xml", type: GOVERNMENT, category: CYBERSECURITY, region: US }
      - { id: nist, name: NIST News, url: "https://www.nist.gov/news-events/news/rss.xml", type: GOVERNMENT, category: EMERGING, region: US }
      # --- Reputable technology media
      - { id: ieee-spectrum, name: IEEE Spectrum, url: "https://spectrum.ieee.org/feeds/feed.rss", type: MEDIA, category: EMERGING, region: Global }
      - { id: semiengineering, name: Semiconductor Engineering, url: "https://semiengineering.com/feed/", type: MEDIA, category: SEMICONDUCTOR, region: Global }
      - { id: robot-report, name: The Robot Report, url: "https://www.therobotreport.com/feed/", type: MEDIA, category: ROBOTICS, region: Global }
      - { id: spacenews, name: SpaceNews, url: "https://spacenews.com/feed/", type: MEDIA, category: SPACE, region: Global }
      - { id: infoq, name: InfoQ, url: "https://www.infoq.com/feed/", type: MEDIA, category: SOFTWARE_ENGINEERING, region: Global }
      - { id: ars-technica, name: Ars Technica - Technology Lab, url: "https://feeds.arstechnica.com/arstechnica/technology-lab", type: MEDIA, category: EMERGING, region: Global }

logging:
  level:
    org.hibernate.SQL: warn
